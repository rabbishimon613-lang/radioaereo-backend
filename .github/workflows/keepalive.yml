name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://radioaereo-backend.onrender.com/health || curl -fsS --max-time 90 https://radioaereo-backend.onrender.com/health
